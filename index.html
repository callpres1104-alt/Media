<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <title>Ad Subs</title> 
  <style> 
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 
auto; padding: 20px; } 
    input, textarea { width: 100%; margin-bottom: 15px; padding: 10px; 
} 
    button { padding: 12px 20px; background-color: #0070f3; color: 
white; border: none; cursor: pointer; } 
  </style> 
</head> 
<body> 
 
  <h2>Adertise Across Our Media</h2> 
  <p>Submit your ad content and pay to confirm your submission.(.jpg,.png,.pdf,.docx,.mp4) Please make sure uploads are less than 3MB.</p> 
 
  <form id="adForm"> 
    <input type="text" id="title" placeholder="Ad Title" required /> 
    <textarea id="description" placeholder="Short Description" 
rows="5" required></textarea> 
    <input type="file" id="fileUpload" accept=".jpg,.png,.pdf,.docx,.mp4" 
required /> 
    <button type="submit">Continue to Payment</button> 
  </form> 
 
  <script> 
    const form = document.getElementById('adForm'); 
    form.addEventListener('submit', async (e) => { 
      e.preventDefault(); 
 
      const title = document.getElementById('title').value; 
      const description = 
document.getElementById('description').value; 
      const file = document.getElementById('fileUpload').files[0]; 
 
      if (!file) { 
        alert('Please upload a file.'); 
        return; 
      } 
 // Optional file type validation
const allowedTypes = ['image/jpeg', 'image/png', 'application/pdf', 'video/mp4'];
if (!allowedTypes.includes(file.type)) {
  alert('File type not allowed. Please upload a .jpg,.png,.pdf,.docx,.mp4');
  return;
}
      // Convert file to Base64 
      const reader = new FileReader(); 
      reader.onloadend = () => { 
        const base64File = reader.result; 
        // Store in localStorage to retrieve after payment 
        localStorage.setItem('adData', JSON.stringify({ title, 
description, file: base64File })); 
 
        // Redirect to payment (Square link) 
        window.location.href = 
"https://square.link/u/NXnzT0Ce?src=sheet"; 
      }; 
      reader.readAsDataURL(file); 
    }); 
  </script> 
 
</body> 
</html>
